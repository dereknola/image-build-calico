---
name: Update upstream version
sources:
  tag:
    name: Get upstream release
    kind: githubrelease
    spec:
      owner: '{{ .scm.upstream.owner }}'
      repository: '{{ .scm.upstream.repository }}'
      token: '{{ requiredEnv .github.token }}'
      typefilter:
        release: true
        draft: false
        prerelease: false
      versionfilter:
        kind: semver
  gomod:
    name: Get golang version
    kind: file
    dependson:
      - tag
    spec:
      file: 'https://raw.githubusercontent.com/{{ .scm.upstream.owner }}/{{ .scm.upstream.repository }}/{{ source "tag" }}/go.mod'
      matchpattern: 'go ([0-9]+\.[0-9]+)'
    transformers:
      - trimprefix: 'go '
  go_version:
    name: Get upstream Go build version
    kind: file
    dependson:
      - tag
    spec:
      file: 'https://raw.githubusercontent.com/{{ .scm.upstream.owner }}/{{ .scm.upstream.repository }}/{{ source "tag" }}/metadata.mk'
      matchpattern: 'GO_VERSION=[0-9]+\.[0-9]+\.[0-9]+'
    transformers:
      - trimprefix: 'GO_VERSION='
  llvm_version:
    name: Get upstream LLVM version
    kind: file
    dependson:
      - tag
    spec:
      file: 'https://raw.githubusercontent.com/{{ .scm.upstream.owner }}/{{ .scm.upstream.repository }}/{{ source "tag" }}/metadata.mk'
      matchpattern: 'LLVM_VERSION=[0-9]+\.[0-9]+\.[0-9]+'
    transformers:
      - trimprefix: 'LLVM_VERSION='
  k8s_version:
    name: Get upstream Kubernetes version
    kind: file
    dependson:
      - tag
    spec:
      file: 'https://raw.githubusercontent.com/{{ .scm.upstream.owner }}/{{ .scm.upstream.repository }}/{{ source "tag" }}/metadata.mk'
      matchpattern: 'K8S_VERSION=v[0-9A-Za-z.-]+'
    transformers:
      - trimprefix: 'K8S_VERSION=v'
  envoy_gateway_version:
    name: Get upstream Envoy Gateway version
    kind: file
    dependson:
      - tag
    spec:
      file: 'https://raw.githubusercontent.com/{{ .scm.upstream.owner }}/{{ .scm.upstream.repository }}/{{ source "tag" }}/third_party/envoy-gateway/Makefile'
      matchpattern: 'ENVOY_GATEWAY_VERSION=[^[:space:]]+'
    transformers:
      - trimprefix: 'ENVOY_GATEWAY_VERSION='
  envoy_ratelimit_version:
    name: Get upstream Envoy Ratelimit version
    kind: file
    dependson:
      - tag
    spec:
      file: 'https://raw.githubusercontent.com/{{ .scm.upstream.owner }}/{{ .scm.upstream.repository }}/{{ source "tag" }}/third_party/envoy-ratelimit/Makefile'
      matchpattern: 'ENVOY_RATELIMIT_VERSION=[^[:space:]]+'
    transformers:
      - trimprefix: 'ENVOY_RATELIMIT_VERSION='
  envoybinary_image:
    name: Get upstream Envoy binary image
    kind: file
    dependson:
      - tag
    spec:
      file: 'https://raw.githubusercontent.com/{{ .scm.upstream.owner }}/{{ .scm.upstream.repository }}/{{ source "tag" }}/third_party/envoy-proxy/Makefile'
      matchpattern: 'ENVOYBINARY_IMAGE[[:space:]]*\?=[[:space:]]*[^[:space:]]+'
    transformers:
      - findsubmatch:
          pattern: 'ENVOYBINARY_IMAGE[[:space:]]*\?=[[:space:]]*([^[:space:]]+)'
          captureindex: 1
  calico_whisker_digest:
    name: Get upstream Whisker image digest
    kind: dockerdigest
    dependson:
      - tag
    spec:
      image: quay.io/calico/whisker
      tag: '{{ source "tag" }}'
targets:
  calico_go_build_image:
    name: 'Pin Calico go-build image for upstream version {{ source "tag" }}'
    kind: file
    scmid: default
    disablesourceinput: true
    spec:
      file: Dockerfile
      matchpattern: '(?m)^ARG CALICO_GO_BUILD_IMAGE=.*$'
      replacepattern: 'ARG CALICO_GO_BUILD_IMAGE=calico/go-build:{{ source "go_version" }}-llvm{{ source "llvm_version" }}-k8s{{ source "k8s_version" }}'
  envoy_gateway_version:
    name: 'Pin Envoy Gateway version for upstream version {{ source "tag" }}'
    kind: file
    scmid: default
    disablesourceinput: true
    spec:
      file: Dockerfile
      matchpattern: '(?m)^ARG ENVOY_GATEWAY_VERSION=.*$'
      replacepattern: 'ARG ENVOY_GATEWAY_VERSION={{ source "envoy_gateway_version" }}'
  envoy_ratelimit_version:
    name: 'Pin Envoy Ratelimit version for upstream version {{ source "tag" }}'
    kind: file
    scmid: default
    disablesourceinput: true
    spec:
      file: Dockerfile
      matchpattern: '(?m)^ARG ENVOY_RATELIMIT_VERSION=.*$'
      replacepattern: 'ARG ENVOY_RATELIMIT_VERSION={{ source "envoy_ratelimit_version" }}'
  envoybinary_image:
    name: 'Pin Envoy binary image for upstream version {{ source "tag" }}'
    kind: file
    scmid: default
    disablesourceinput: true
    spec:
      file: Dockerfile
      matchpattern: '(?m)^ARG ENVOYBINARY_IMAGE=.*$'
      replacepattern: 'ARG ENVOYBINARY_IMAGE={{ source "envoybinary_image" }}'
  calico_whisker_source_digest:
    name: 'Pin Whisker image digest for upstream version {{ source "tag" }}'
    kind: file
    scmid: default
    disablesourceinput: true
    spec:
      file: Dockerfile
      matchpattern: '(?m)^ARG CALICO_WHISKER_SOURCE_DIGEST=.*$'
      replacepattern: 'ARG CALICO_WHISKER_SOURCE_DIGEST={{ source "calico_whisker_digest" }}'
  tagfile:
    name: 'Bump TAG to upstream version {{ source "tag" }}'
    kind: file
    scmid: default
    disablesourceinput: true
    spec:
      file: TAG
      matchpattern: '(?m)^(.+)$'
      replacepattern: '{{ source "tag" }}'
scms:
  default:
    kind: github
    spec:
      token: '{{ requiredEnv .github.token }}'
      username: '{{ requiredEnv .github.username }}'
      user: '{{ .github.user }}'
      email: '{{ .github.email }}'
      owner: '{{ .scm.default.owner }}'
      repository: '{{ .scm.default.repository }}'
      branch: '{{ .scm.default.branch }}'
actions:
  default:
    title: 'Bump to upstream version {{ source "tag" }}'
    kind: github/pullrequest
    spec:
      merge:
        strategy: manual
      mergemethod: squash
      labels:
        - chore
        - skip-changelog
        - status/auto-created
    scmid: default
