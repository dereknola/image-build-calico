on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read
  security-events: write # upload Sarif results

name: Build
jobs:
  build-amd64:
    runs-on: ${{ github.repository_owner == 'rancher' && format('runs-on,runner=4cpu-linux-x64,run-id={0}', github.run_id) || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: hardened-calico
            target: calico_image
          - image: hardened-calico-node
            target: calico_node_image
    steps:
    - name: Checkout code
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

    - name: Set the TAG value
      id: get-TAG
      run: |
        echo "$(make -s log | grep TAG)" >> "$GITHUB_ENV"
    - name: Build container image
      uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
      with:
        context: .
        push: false
        load: true
        tags: rancher/${{ matrix.image }}:${{ env.TAG }}
        target: ${{ matrix.target }}
        platforms: linux/amd64
        file: Dockerfile
        build-args: |
          TAG=${{ env.TAG }}

    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
      with:
        image-ref: rancher/${{ matrix.image }}:${{ env.TAG }}
        ignore-unfixed: true
        vuln-type: 'os,library'
        severity: 'CRITICAL,HIGH'
        format: 'sarif'
        output: 'trivy-results-${{ matrix.image }}-amd64.sarif'
    - name: Upload Trivy scan results to GitHub Security tab
      uses: github/codeql-action/upload-sarif@7188fc363630916deb702c7fdcf4e481b751f97a # v4.37.1
      if: always()
      with:
        sarif_file: 'trivy-results-${{ matrix.image }}-amd64.sarif'
        category: ${{ matrix.image }}-amd64

  build-arm64:
    runs-on: ${{ github.repository_owner == 'rancher' && format('runs-on,runner=4cpu-linux-arm64,run-id={0}', github.run_id) || 'ubuntu-24.04-arm' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: hardened-calico
            target: calico_image
          - image: hardened-calico-node
            target: calico_node_image
    steps:
    - name: Check out code
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

    - name: Set up QEMU
      uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

    - name: Set the TAG value
      id: get-TAG
      run: |
        echo "$(make -s log | grep TAG)" >> "$GITHUB_ENV"
    - name: Build container image
      uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
      with:
        context: .
        push: false
        load: true
        tags: rancher/${{ matrix.image }}:${{ env.TAG }}
        target: ${{ matrix.target }}
        file: Dockerfile
        platforms: linux/arm64
        build-args: |
          TAG=${{ env.TAG }}
